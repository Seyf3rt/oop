<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sonora - diagrama de classes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff;
         font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #000; }
  #canvas { position: relative; width: 2930px; height: 3020px; background: #fff; }

  .titulo { position: absolute; left: 40px; top: 34px; }
  .titulo h1 { margin: 0; font-size: 34px; font-weight: 700; }
  .titulo p  { margin: 6px 0 0; font-size: 20px; color: #333; }

  .box { position: absolute; border: 2px solid #000; background: #fff; }
  .box .nome { text-align: center; font-size: 25px; font-weight: 700; padding: 10px 12px; }
  .box .nome .estereotipo { display: block; font-size: 18px; font-weight: 400; font-style: normal; }
  .box .sec { border-top: 2px solid #000; padding: 8px 14px; }
  .box .sec div { font-size: 20px; line-height: 27px; padding-left: 18px; text-indent: -18px; }

  .abs { font-style: italic; }
  .est { text-decoration: underline; }

  .nota { position: absolute; border: 2px solid #000; background: #f4f4f4; padding: 18px 22px; }
  .nota h2 { margin: 0 0 12px; font-size: 23px; }
  .nota p  { margin: 0 0 9px; font-size: 19px; line-height: 26px; }
  .nota table { border-collapse: collapse; font-size: 19px; line-height: 26px; }
  .nota td { padding: 1px 0; vertical-align: top; }
  .nota td:first-child { padding-right: 24px; white-space: nowrap; }

  svg#fios { position: absolute; left: 0; top: 0; pointer-events: none; }
  svg#fios line, svg#fios polyline, svg#fios path { stroke: #000; stroke-width: 2; fill: none; }
  svg#fios polygon.tri { fill: #fff; stroke: #000; stroke-width: 2; }
  svg#fios text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 20px; fill: #000; }
  svg#fios text.verbo { font-style: italic; }
</style>
</head>
<body>
<div id="canvas">
  <div class="titulo">
    <h1>Sonora &middot; Fase 09 &mdash; generalizacao, classes abstratas e final</h1>
    <p>classe abstrata e metodo abstrato em <i>italico</i> &middot; membro <u>static</u> sublinhado &middot; {leaf} = final &middot; papel &middot; nome com direcao &middot; multiplicidade &middot; navegabilidade</p>
  </div>
  <svg id="fios"></svg>
</div>

<script>

    ]

    ops: [

    ]

};

// ---------- desenha as caixas ----------
const canvas = document.getElementById('canvas');
const linha = m => `<div class="${m.abs ? 'abs' : ''}${m.est ? ' est' : ''}">${m.t}</div>`;

for (const [id, c] of Object.entries(CLASSES)) {
  const el = document.createElement('div');
  el.className = 'box';
  el.id = id;
  el.style.left = c.x + 'px';
  el.style.top = c.y + 'px';
  el.style.width = c.w + 'px';
  el.innerHTML =
    `<div class="nome${c.abstrata ? ' abs' : ''}">` +
      (c.abstrata ? '<span class="estereotipo">&laquo;abstract&raquo;</span>' : '') +
      c.nome +
    `</div>` +
    (c.attrs.length ? `<div class="sec">${c.attrs.map(linha).join('')}</div>` : '') +
    `<div class="sec">${c.ops.map(linha).join('')}</div>`;
  canvas.appendChild(el);
}

// ---------- notas ----------
function nota(x, y, w, html) {
  const el = document.createElement('div');
  el.className = 'nota';
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px';
  el.innerHTML = html;
  canvas.appendChild(el);
}

nota(40, 1560, 560, `
  <h2>Por que estas multiplicidades</h2>
  <p><b>assina:</b> todo Usuario tem exatamente 1 Plano - ele nasce no PlanoGratuito e
     assinar() recusa nulo, entao nunca fica sem. Cada Plano criado no menu pertence a um
     unico usuario (1), e so o Usuario conhece o Plano: a navegabilidade e de mao unica.</p>
  <p><b>cadastra / registra / hospeda:</b> a plataforma e uma so (1) e cada acervo pode
     estar vazio ou ter quantos itens forem cadastrados (0..*).</p>
  <p><b>contem:</b> uma playlist pode estar vazia e a mesma musica pode aparecer em varias
     playlists, entao 0..* nas duas pontas.</p>
  <p><b>cria:</b> toda playlist tem exatamente 1 dono (o construtor recusa dono nulo) e um
     usuario pode ter 0..* playlists.</p>
  <p><b>segue:</b> quem entra na plataforma nao segue ninguem e nao ha teto para quantos
     segue ou por quantos e seguido (0..* / 0..*).</p>
  <p><b>Heranca nao leva multiplicidade:</b> ela nao liga objetos, diz que todo PlanoPago
     e um Plano e que toda Musica e um Conteudo.</p>
`);

nota(40, 2220, 560, `
  <h2>Como ler o diagrama</h2>
  <table>
    <tr><td><i>Nome em italico</i></td><td>classe ou metodo <b>abstrato</b>: Conteudo, Plano e
        PlanoPago nao podem ser instanciados</td></tr>
    <tr><td>{leaf}</td><td><b>final</b>: metodo que nao pode ser sobrescrito (reproduzir, resumo)
        ou classe que nao pode ser estendida (PlanoGratuito)</td></tr>
    <tr><td><u>sublinhado</u></td><td>membro static (um so para toda a classe)</td></tr>
    <tr><td>#</td><td>protected: visivel na propria classe e nas subclasses</td></tr>
    <tr><td>- papel</td><td>nome do lado da associacao (ex.: - plano)</td></tr>
    <tr><td>nome &#9658;</td><td>verbo e direcao de leitura (ex.: Usuario assina &#9658; Plano)</td></tr>
    <tr><td>0..* / 1</td><td>multiplicidade em cada ponta</td></tr>
    <tr><td>&mdash;&mdash;&gt;</td><td>navegabilidade: a seta aberta marca o unico lado navegavel</td></tr>
    <tr><td>&mdash;&mdash;&#9655;</td><td>especializacao (heranca): o triangulo vazado fica na superclasse</td></tr>
  </table>
  <p style="margin-top:14px">Depois da generalizacao, nome e maxDispositivos moram em Plano,
     precoMensal mora em PlanoPago e cada subclasse guarda apenas o que e dela. resumo() e
     escrito uma unica vez em Plano e chama calcularMensalidade(), que cada plano concreto
     implementa a sua maneira.</p>
`);

// ---------- fios ----------
const svg = document.getElementById('fios');
svg.setAttribute('width', canvas.offsetWidth);
svg.setAttribute('height', canvas.offsetHeight);
const NS = 'http://www.w3.org/2000/svg';

const R = id => {
  const e = document.getElementById(id);
  return { x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight,
           cx: e.offsetLeft + e.offsetWidth / 2, cy: e.offsetTop + e.offsetHeight / 2,
           dir: e.offsetLeft + e.offsetWidth, baixo: e.offsetTop + e.offsetHeight };
};
const add = (tag, attrs, texto) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (texto !== undefined) n.textContent = texto;
  svg.appendChild(n);
  return n;
};
const poli = pts => add('polyline', { points: pts.map(p => p.join(',')).join(' ') });
const txt = (x, y, t, anchor = 'start', cls = '') =>
  add('text', { x, y, 'text-anchor': anchor, class: cls }, t);

// seta aberta (navegabilidade) apontando para 'lado'
function seta(x, y, lado) {
  const d = 15;
  if (lado === 'dir')    poli([[x - d, y - d], [x, y], [x - d, y + d]]);
  if (lado === 'esq')    poli([[x + d, y - d], [x, y], [x + d, y + d]]);
  if (lado === 'baixo')  poli([[x - d, y - d], [x, y], [x + d, y - d]]);
  if (lado === 'cima')   poli([[x - d, y + d], [x, y], [x + d, y + d]]);
}

// heranca: triangulo vazado embaixo da superclasse + barramento ate as subclasses
function heranca(paiId, filhosIds, barraY) {
  const p = R(paiId);
  const h = 20;
  add('polygon', { class: 'tri',
    points: `${p.cx},${p.baixo} ${p.cx - 16},${p.baixo + h} ${p.cx + 16},${p.baixo + h}` });
  poli([[p.cx, p.baixo + h], [p.cx, barraY]]);
  const cxs = filhosIds.map(id => R(id).cx);
  poli([[Math.min(...cxs), barraY], [Math.max(...cxs), barraY]]);
  filhosIds.forEach(id => { const f = R(id); poli([[f.cx, barraY], [f.cx, f.y]]); });
  txt(p.cx + 22, p.baixo + 34, 'e um(a)', 'start', 'verbo');
}

heranca('conteudo', ['musica', 'podcast'], R('musica').y - 90);
heranca('plano', ['planopago', 'planogratuito'], R('planopago').y - 110);
heranca('planopago', ['planoindividual', 'planofamilia'], R('planoindividual').y - 110);

// Plataforma 1 --- 0..* Musica   (cadastra)
(() => {
  const p = R('plataforma'), m = R('musica'), y = 1090;
  poli([[p.dir, y], [m.x, y]]);
  seta(m.x, y, 'dir');
  txt(p.dir + 8, y - 16, '1');
  txt(m.x - 8, y - 16, '0..*', 'end');
  txt(m.x - 8, y + 34, '- acervo', 'end');
  txt((p.dir + m.x) / 2, y - 48, 'cadastra ▶', 'middle', 'verbo');
})();

// Plataforma 1 --- 0..* Podcast   (cadastra, por cima)
(() => {
  const p = R('plataforma'), d = R('podcast'), topo = 140, corredor = 1900, y = 1080;
  poli([[p.cx, p.y], [p.cx, topo], [corredor, topo], [corredor, y], [d.dir, y]]);
  seta(d.dir, y, 'esq');
  txt(p.cx + 10, p.y - 14, '1');
  txt(d.dir + 14, y - 16, '0..*');
  txt(d.dir + 14, y + 34, '- podcasts');
  txt(corredor - 14, topo - 14, 'cadastra ▶', 'end', 'verbo');
})();

// Plataforma 1 --- 0..* Playlist  (hospeda)
(() => {
  const p = R('plataforma'), l = R('playlist'), y = 1480;
  poli([[p.cx, p.baixo], [p.cx, y], [l.x, y]]);
  seta(l.x, y, 'dir');
  txt(p.cx + 10, p.baixo + 26, '1');
  txt(l.x - 8, y - 16, '0..*', 'end');
  txt(l.x - 8, y + 34, '- playlists', 'end');
  txt(l.x - 150, y - 48, 'hospeda ▶', 'middle', 'verbo');
})();

// Plataforma 1 --- 0..* Usuario   (registra)
(() => {
  const p = R('plataforma'), u = R('usuario'), y = 1370, entra = u.x + 110;
  poli([[p.dir, y], [entra, y], [entra, u.y]]);
  seta(entra, u.y, 'baixo');
  txt(p.dir + 8, y - 16, '1');
  txt(entra + 14, u.y - 20, '0..*');
  txt(entra + 14, y - 16, '- usuarios');
  txt(p.dir + 120, y - 16, 'registra ▶', 'start', 'verbo');
})();

// Playlist 0..* --- 0..* Musica   (contem)
(() => {
  const l = R('playlist'), m = R('musica'), x = 1000;
  poli([[x, l.y], [x, m.baixo]]);
  seta(x, m.baixo, 'cima');
  txt(x + 14, l.y - 16, '0..*');
  txt(x + 14, m.baixo + 34, '0..*');
  txt(x - 14, m.baixo + 34, '- faixas', 'end');
  txt(x + 14, m.baixo + 62, 'contem ▲', 'start', 'verbo');
})();

// Playlist 0..* --- 1 Usuario   (cria)
(() => {
  const l = R('playlist'), u = R('usuario'), y = 1780;
  poli([[l.dir, y], [u.x, y]]);
  seta(u.x, y, 'dir');
  txt(l.dir + 8, y - 16, '0..*');
  txt(l.dir + 8, y + 34, '- playlists');
  txt(u.x - 8, y - 16, '1', 'end');
  txt(u.x - 8, y + 34, '- dono', 'end');
  txt((l.dir + u.x) / 2, y - 48, '◀ cria', 'middle', 'verbo');
})();

// Usuario 1 --- 1 Plano   (assina)  <<< a associacao nova da Parte E
(() => {
  const u = R('usuario'), p = R('plano'), y = 1510;
  poli([[u.dir, y], [p.x, y]]);
  seta(p.x, y, 'dir');
  txt(u.dir + 8, y - 16, '1');
  txt(p.x - 8, y - 16, '1', 'end');
  txt(p.x - 8, y + 34, '- plano', 'end');
  txt((u.dir + p.x) / 2, y - 48, 'assina ▶', 'middle', 'verbo');
})();

// Usuario 0..* --- 0..* Usuario   (segue, reflexiva)
(() => {
  const u = R('usuario'), y = u.baixo + 110, a = u.x + 120, b = u.dir - 120;
  poli([[a, u.baixo], [a, y], [b, y], [b, u.baixo]]);
  seta(b, u.baixo, 'cima');
  txt(a - 14, u.baixo + 30, '0..*', 'end');
  txt(a - 14, u.baixo + 58, '- seguindo', 'end');
  txt(b + 14, u.baixo + 30, '0..*');
  txt(b + 14, u.baixo + 58, '- seguidores');
  txt((a + b) / 2, y + 34, 'segue ▶', 'middle', 'verbo');
})();
</script>
</body>
</html>
