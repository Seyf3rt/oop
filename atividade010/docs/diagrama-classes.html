<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sonora - diagrama de classes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff;
         font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #000; }
  #canvas { position: relative; width: 3020px; height: 3420px; background: #fff; }

  .titulo { position: absolute; left: 40px; top: 34px; }
  .titulo h1 { margin: 0; font-size: 34px; font-weight: 700; }
  .titulo p  { margin: 6px 0 0; font-size: 20px; color: #333; }

  .box { position: absolute; border: 2px solid #000; background: #fff; }
  .box .nome { text-align: center; font-size: 25px; font-weight: 700; padding: 10px 12px; }
  .box .nome .estereotipo { display: block; font-size: 18px; font-weight: 400; font-style: normal; }
  .box .sec { border-top: 2px solid #000; padding: 8px 14px; }
  .box .sec div { font-size: 20px; line-height: 27px; padding-left: 18px; text-indent: -18px; }

  .abs { font-style: italic; }
  .est { text-decoration: underline; }

  .nota { position: absolute; border: 2px solid #000; background: #f4f4f4; padding: 18px 22px; }
  .nota h2 { margin: 0 0 12px; font-size: 23px; }
  .nota p  { margin: 0 0 9px; font-size: 19px; line-height: 26px; }
  .nota table { border-collapse: collapse; font-size: 19px; line-height: 26px; }
  .nota td { padding: 1px 0; vertical-align: top; }
  .nota td:first-child { padding-right: 24px; white-space: nowrap; }

  svg#fios { position: absolute; left: 0; top: 0; pointer-events: none; }
  svg#fios line, svg#fios polyline, svg#fios path { stroke: #000; stroke-width: 2; fill: none; }
  svg#fios polyline.tracejada { stroke-dasharray: 12 8; }
  svg#fios polygon.tri { fill: #fff; stroke: #000; stroke-width: 2; }
  svg#fios text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 20px; fill: #000; }
  svg#fios text.verbo { font-style: italic; }
</style>
</head>
<body>

  <div class="titulo">
    <h1>Sonora &middot; Fase 10 &mdash; polimorfismo e interfaces</h1>
    <p>&laquo;interface&raquo; &middot; realizacao tracejada &middot; classe e metodo abstrato em <i>italico</i> &middot; <u>static</u> sublinhado &middot; {leaf} = final &middot; papel &middot; multiplicidade &middot; navegabilidade</p>
  </div>
  <svg id="fios"></svg>
</div>

// ---------- desenha as caixas ----------
const canvas = document.getElementById('canvas');
const linha = m => `<div class="${m.abs ? 'abs' : ''}${m.est ? ' est' : ''}">${m.t}</div>`;

for (const [id, c] of Object.entries(CLASSES)) {
  const el = document.createElement('div');
  el.className = 'box';
  el.id = id;
  el.style.left = c.x + 'px';
  el.style.top = c.y + 'px';
  el.style.width = c.w + 'px';
  const estereotipo = c.interface ? '&laquo;interface&raquo;' : c.abstrata ? '&laquo;abstract&raquo;' : '';
  el.innerHTML =
    `<div class="nome${c.abstrata ? ' abs' : ''}">` +
      (estereotipo ? `<span class="estereotipo">${estereotipo}</span>` : '') +
      c.nome +

    (c.attrs.length ? `<div class="sec">${c.attrs.map(linha).join('')}</div>` : '') +

// ---------- notas ----------

nota(40, 2760, 860, `
  <h2>Por que estas multiplicidades</h2>
  <p><b>assina:</b> todo Usuario tem exatamente 1 Plano - ele nasce no PlanoGratuito e
     assinar() recusa nulo, entao nunca fica sem. Cada Plano criado no menu pertence a um
     unico usuario (1), e so o Usuario conhece o Plano: a navegabilidade e de mao unica.</p>
  <p><b>cadastra / registra / hospeda / veicula:</b> a plataforma e uma so (1) e cada
     colecao pode estar vazia ou ter quantos itens forem cadastrados (0..*). Musicas e
     podcasts agora moram na mesma colecao de Conteudo.</p>
  <p><b>contem:</b> uma playlist pode estar vazia, misturar musicas e podcasts, e o mesmo
     conteudo pode aparecer em varias playlists, entao 0..* nas duas pontas.</p>
  <p><b>cria:</b> toda playlist tem exatamente 1 dono (o construtor recusa dono nulo) e um
     usuario pode ter 0..* playlists.</p>
  <p><b>segue:</b> quem entra na plataforma nao segue ninguem e nao ha teto para quantos
     segue ou por quantos e seguido (0..* / 0..*).</p>
  <p><b>Heranca e realizacao nao levam multiplicidade:</b> elas nao ligam objetos, dizem que
     todo PlanoPago e um Plano e que todo Anuncio cumpre o contrato de Faturavel.</p>
`);

nota(940, 2760, 900, `
  <h2>Como ler o diagrama</h2>
  <table>
    <tr><td>&laquo;interface&raquo;</td><td>so declara o que fazer, sem atributos; metodos sem corpo
        em <i>italico</i></td></tr>
    <tr><td>{default}</td><td>metodo com corpo dentro da interface: quem realiza ganha de graca</td></tr>
    <tr><td>- - - - &#9655;</td><td><b>realizacao</b> (implements): o triangulo vazado fica na interface</td></tr>
    <tr><td>&mdash;&mdash;&#9655;</td><td>especializacao (extends): entre classes ou entre interfaces</td></tr>
    <tr><td><i>Nome em italico</i></td><td>classe ou metodo <b>abstrato</b>: Conteudo, Plano e
        PlanoPago nao podem ser instanciados</td></tr>
    <tr><td>{leaf}</td><td><b>final</b>: metodo que nao pode ser sobrescrito ou classe que nao
        pode ser estendida</td></tr>
    <tr><td><u>sublinhado</u></td><td>membro static</td></tr>
    <tr><td>#</td><td>protected: visivel na propria classe e nas subclasses</td></tr>
    <tr><td>- papel / nome &#9658;</td><td>nome da ponta e verbo com direcao de leitura</td></tr>
    <tr><td>&mdash;&mdash;&gt;</td><td>navegabilidade: a seta aberta marca o unico lado navegavel</td></tr>
  </table>
  <p style="margin-top:14px">Plano realiza Faturavel mas, por ser abstrata, nao implementa
     calcularMensalidade(): a obrigacao desce para PlanoGratuito, PlanoIndividual e PlanoFamilia.
     Conteudo realiza Reproduzivel com o getDuracaoSegundos() e o reproduzir() {leaf} que ja
     tinha, e getDuracaoFormatada() vem do default de Cronometravel.</p>
`);

// ---------- fios ----------
const svg = document.getElementById('fios');
svg.setAttribute('width', canvas.offsetWidth);
svg.setAttribute('height', canvas.offsetHeight);
const NS = 'http://www.w3.org/2000/svg';

const R = id => {
  const e = document.getElementById(id);
  return { x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight,
           cx: e.offsetLeft + e.offsetWidth / 2, cy: e.offsetTop + e.offsetHeight / 2,
           dir: e.offsetLeft + e.offsetWidth, baixo: e.offsetTop + e.offsetHeight };
};
const add = (tag, attrs, texto) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (texto !== undefined) n.textContent = texto;
  svg.appendChild(n);
  return n;
};
const poli = (pts, cls) => add('polyline', { points: pts.map(p => p.join(',')).join(' '),
                                             ...(cls ? { class: cls } : {}) });
const txt = (x, y, t, anchor = 'start', cls = '') =>
  add('text', { x, y, 'text-anchor': anchor, class: cls }, t);

// seta aberta (navegabilidade) apontando para 'lado'
function seta(x, y, lado) {
  const d = 15;
  if (lado === 'dir')    poli([[x - d, y - d], [x, y], [x - d, y + d]]);
  if (lado === 'esq')    poli([[x + d, y - d], [x, y], [x + d, y + d]]);
  if (lado === 'baixo')  poli([[x - d, y - d], [x, y], [x + d, y - d]]);
  if (lado === 'cima')   poli([[x - d, y + d], [x, y], [x + d, y + d]]);
}

// heranca: triangulo vazado embaixo da superclasse + barramento ate as subclasses
function heranca(paiId, filhosIds, barraY, rotulo = 'e um(a)') {
  const p = R(paiId);
  const h = 20;
  add('polygon', { class: 'tri',
    points: `${p.cx},${p.baixo} ${p.cx - 16},${p.baixo + h} ${p.cx + 16},${p.baixo + h}` });
  poli([[p.cx, p.baixo + h], [p.cx, barraY]]);
  const cxs = filhosIds.map(id => R(id).cx);
  poli([[Math.min(...cxs), barraY], [Math.max(...cxs), barraY]]);
  filhosIds.forEach(id => { const f = R(id); poli([[f.cx, barraY], [f.cx, f.y]]); });
  txt(p.cx + 22, p.baixo + 34, rotulo, 'start', 'verbo');
}

// realizacao: linha tracejada que termina num triangulo vazado encostado na interface.
// O ultimo ponto e a ponta do triangulo; 'lado' e para onde ele aponta.
function realizacao(pts, lado) {
  const [x, y] = pts[pts.length - 1];
  const h = 20, b = 16;
  const base = { cima: [x, y + h], baixo: [x, y - h], esq: [x + h, y], dir: [x - h, y] }[lado];
  poli([...pts.slice(0, -1), base], 'tracejada');
  const tri = (lado === 'cima' || lado === 'baixo')
    ? `${x},${y} ${base[0] - b},${base[1]} ${base[0] + b},${base[1]}`
    : `${x},${y} ${base[0]},${base[1] - b} ${base[0]},${base[1] + b}`;
  add('polygon', { class: 'tri', points: tri });
}

heranca('cronometravel', ['reproduzivel'], R('reproduzivel').y - 40, 'estende');
heranca('conteudo', ['musica', 'podcast'], R('musica').y - 70);
heranca('plano', ['planopago', 'planogratuito'], R('planopago').y - 110);
heranca('planopago', ['planoindividual', 'planofamilia'], R('planoindividual').y - 110);

// ---------- realizacoes ----------
(() => {
  const rep = R('reproduzivel'), cro = R('cronometravel'), con = R('conteudo'), an = R('anuncio');
  const fat = R('faturavel'), cob = R('cobravel'), pl = R('plano');

  // Conteudo ..|> Reproduzivel
  realizacao([[con.cx, con.y], [rep.cx, rep.baixo]], 'cima');

  // Anuncio ..|> Reproduzivel
  const yr = rep.cy;
  realizacao([[an.x + 100, an.y], [an.x + 100, yr], [rep.dir, yr]], 'esq');

  // Anuncio ..|> Cronometravel (tambem aparece no implements do codigo)
  const yc = cro.cy;
  realizacao([[an.x + 260, an.y], [an.x + 260, yc], [cro.dir, yc]], 'esq');

  // Anuncio ..|> Faturavel
  const xf = 2180;
  realizacao([[xf, an.baixo], [xf, fat.y]], 'baixo');

  // Anuncio ..|> Cobravel
  const ya = an.baixo - 60, xc = cob.cx + 60;
  realizacao([[an.dir, ya], [xc, ya], [xc, cob.y]], 'baixo');

  // Plano ..|> Faturavel  e  Plano ..|> Cobravel
  realizacao([[2240, pl.y], [2240, fat.baixo]], 'cima');
  realizacao([[2600, pl.y], [2600, cob.baixo]], 'cima');

  txt(con.cx + 22, con.y - 30, 'realiza', 'start', 'verbo');
})();

// ---------- associacoes ----------

// Plataforma 1 --- 0..* Conteudo   (cadastra)
(() => {
  const p = R('plataforma'), c = R('conteudo'), y = 1000;
  poli([[p.dir, y], [c.x, y]]);
  seta(c.x, y, 'dir');

})();
